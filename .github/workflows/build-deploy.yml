name: Build Check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: bash scripts/build.sh
      - name: Build must not modify source data
        run: git diff --exit-code -- data/ || (echo "::error::the build changed files in data/"; exit 1)
